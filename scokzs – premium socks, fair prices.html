</aside><div><p class="sub" id="cnt" style="margin:0 0 14px"></p><div class="grid" id="res"></div></div></div></div>`};
function results(){let l=vis().filter(x=>(F.g=="All"||!x.g||x.g=="Unisex"||x.g==F.g)&&(F.cat=="All"||x.c==F.cat)&&x.p<=F.max&&x.n.toLowerCase().includes(F.q.toLowerCase()));
 l.sort((a,b)=>F.sort=="lo"?a.p-b.p:F.sort=="hi"?b.p-a.p:b.r-a.r);
 $("#cnt").textContent=`${l.length} ${l.length==1?"style":"styles"}`;
 $("#res").innerHTML=l.length?l.map(card).join(""):`<p>No socks match those filters. Try a higher price or a different category.</p>`}

const vProd=id=>{const x=pid(id);if(!x||(x.hide&&!edit))return vNF();const SZ=szs(x);sel={size:SZ[1],q:1};const rv=revs(id);
 return `<div class="wrap page"><div class="crumb"><a href="#/">Home</a> / <a href="#/shop">Shop</a> / ${x.n}</div><div class="pd"><div class="big">${thumb(x)}</div><div>
<span class="cat">${x.c}</span>${edit?` <button class="btn sm o" data-act="ed" data-id="${id}">Edit product</button>`:""}<h1>${x.n}</h1><div class="stars">★ ${x.r} · ${rv.length} reviews</div><div class="price" style="margin:10px 0">${R(x.p)}</div><p>${esc(x.d||"")}</p>
<label style="font-weight:700">Size <button class="link" data-act="guide" style="font-weight:400;margin-left:8px">Size guide</button></label>
<div class="opts">${SZ.map((s,i)=>`<button class="sz${i==1?" on":""}" data-act="size" data-v="${s}">${s}</button>`).join("")}</div>
<div class="qty"><button data-act="q-" aria-label="Fewer">−</button><span id="qv">1</span><button data-act="q+" aria-label="More">+</button></div>
<div class="acts"><button class="btn dk" data-act="add" data-id="${id}">Add to Cart</button><button class="btn" data-act="buy" data-id="${id}">Buy Now</button></div>
<ul class="tick">${(x.f&&x.f.length?x.f:DEF).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div>
<div class="two" style="margin-top:44px"><div><h2 style="font-size:32px">Reviews</h2>${rv.map(r=>`<div class="rev"><div class="stars">${"★".repeat(r[1])}${"☆".repeat(5-r[1])}</div><p style="margin:4px 0"><strong>${esc(r[0])}</strong>: ${esc(r[2])}</p></div>`).join("")}</div>
<form class="box f" data-form="rev" data-id="${id}"><h3>Write a review</h3><div><label for="rn">Name</label><input class="in" id="rn" name="n" required></div><div><label for="rr">Rating</label><select class="in" id="rr" name="r"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div><label for="rt">Your review</label><textarea class="in" id="rt" name="t" rows="3" required></textarea></div><button class="btn dk">Post review</button></form></div></div>`};

const vCart=()=>{const ls=lines(),T=tot(ls);
 if(!ls.length)return `<div class="wrap page"><h2>Your cart</h2><p class="sub">Your cart is empty. Find a pair you like.</p><a class="btn" href="#/shop">Shop socks</a></div>`;
 return `<div class="wrap page"><h2>Your cart</h2><div class="two" style="margin-top:20px"><div>${ls.map((l,i)=>`<div class="line">${thumb(l.x)}<div><strong>${l.x.n}</strong><br><span class="cat">Size ${l.size} · ${R(l.x.p)}</span><br><span class="qty" style="margin:6px 0 0"><button data-act="dec" data-k="${i}" aria-label="Fewer">−</button>${l.q}<button data-act="inc" data-k="${i}" aria-label="More">+</button></span> <button class="link" data-act="rm" data-k="${i}">Remove</button></div><strong>${R(l.x.p*l.q)}</strong></div>`).join("")}</div>
<div class="box"><h3>Order summary</h3><div class="sum"><span>Subtotal</span><span>${R(T.s)}</span></div><div class="sum"><span>Delivery</span><span>${T.sh?R(T.sh):"Free"}</span></div><div class="sum t"><span>Total</span><span>${R(T.t)}</span></div>${T.sh?`<p class="cat">Add ${R(799-T.s)} more for free delivery.</p>`:""}<a class="btn full" href="#/checkout" data-act="co">Proceed to Checkout</a></div></div></div>`};

const vCheck=()=>{const ls=lines(),T=tot(ls);if(!ls.length)return vCart();const u=user||{};
 return `<div class="wrap page"><div class="crumb">${buy?"Buy now":"Cart"} / Checkout</div><h2>Checkout</h2><div class="two" style="margin-top:20px"><form class="f" data-form="order" id="of"><div class="box f"><h3>Delivery details</h3><div class="f2"><div><label for="o1">Full name</label><input class="in" id="o1" name="name" required value="${esc(u.name||"")}"></div><div><label for="o2">Phone</label><input class="in" id="o2" name="phone" type="tel" required value="${esc(u.phone||"")}"></div></div><div><label for="o3">Email</label><input class="in" id="o3" name="email" type="email" required value="${esc(u.email||"")}"></div><div><label for="o4">Address</label><input class="in" id="o4" name="addr" required value="${esc(u.addr||"")}"></div><div class="f2"><div><label for="o5">City</label><input class="in" id="o5" name="city" required></div><div><label for="o6">PIN code</label><input class="in" id="o6" name="pin" pattern="[0-9]{6}" title="6-digit PIN code" required></div></div></div>
<div class="box"><h3>Payment</h3>${["UPI","Credit / debit card","Cash on delivery"].map((m,i)=>`<label class="pay"><input type="radio" name="pay" value="${m}"${i?"":" checked"}> ${m}</label>`).join("")}<p class="cat" style="margin:6px 0 0">Demo store: no real payment is taken.</p></div></form>
<div class="box"><h3>Your order</h3>${ls.map(l=>`<div class="sum"><span>${l.x.n} (${l.size}) × ${l.q}</span><span>${R(l.x.p*l.q)}</span></div>`).join("")}<div class="sum"><span>Delivery</span><span>${T.sh?R(T.sh):"Free"}</span></div><div class="sum t"><span>Total</span><span>${R(T.t)}</span></div><button class="btn full" form="of">Place Order</button></div></div></div>`};

const vDone=()=>{if(!last)return vHome();return `<div class="wrap page"><div class="ok"><strong>Order placed. Thank you, ${esc(last.name.split(" ")[0])}!</strong></div><h2 style="margin-top:24px">Order ${last.id}</h2><p class="sub">We'll send updates to ${esc(last.email)}. Estimated delivery: 3–5 days to ${esc(last.city)}. Paying by ${last.pay}.</p><div class="box" style="max-width:520px">${last.items.map(i=>`<div class="sum"><span>${i.n} (${i.size}) × ${i.q}</span><span>${R(i.p*i.q)}</span></div>`).join("")}<div class="sum t"><span>Total</span><span>${R(last.total)}</span></div></div><p style="margin-top:22px"><a class="btn" href="#/shop">Keep shopping</a> <a class="btn o" href="#/account">View my orders</a></p></div>`};

const vAcc=()=>{if(!user)return `<div class="wrap page" style="max-width:480px"><h2>Account</h2><p class="sub">Sign in or create an account to track orders and save your details.</p><form class="box f" data-form="login"><div><label for="a1">Name</label><input class="in" id="a1" name="name" required></div><div><label for="a2">Email</label><input class="in" id="a2" name="email" type="email" required></div><div><label for="a3">Password</label><input class="in" id="a3" name="pw" type="password" minlength="6" required></div><button class="btn dk">Sign in / Create account</button><p class="cat" style="margin:0">Demo only: your details stay in this browser.</p></form></div>`;
 return `<div class="wrap page"><h2>Hi, ${esc(user.name.split(" ")[0])}</h2><div class="tabs"><button class="chip${tab=="orders"?" on":""}" data-act="tab" data-v="orders">Orders</button><button class="chip${tab=="profile"?" on":""}" data-act="tab" data-v="profile">Profile</button><button class="chip" data-act="out">Sign out</button></div>`+
 (tab=="orders"?(orders.length?orders.map(o=>`<div class="box" style="margin-bottom:12px"><div class="sum"><strong>Order ${o.id}</strong><span>${o.date}</span></div><p class="cat" style="margin:0">${o.items.map(i=>`${i.n} × ${i.q}`).join(", ")}</p><div class="sum t"><span>Total</span><span>${R(o.total)}</span></div></div>`).join(""):`<p class="sub">No orders yet.</p><a class="btn" href="#/shop">Start shopping</a>`):
 `<form class="box f" data-form="prof" style="max-width:520px"><div><label for="p1">Name</label><input class="in" id="p1" name="name" required value="${esc(user.name)}"></div><div><label for="p2">Email</label><input class="in" id="p2" name="email" type="email" required value="${esc(user.email)}"></div><div><label for="p3">Phone</label><input class="in" id="p3" name="phone" value="${esc(user.phone||"")}"></div><div><label for="p4">Saved address</label><input class="in" id="p4" name="addr" value="${esc(user.addr||"")}"></div><button class="btn dk">Save changes</button></form>`)+`</div>`};

const vSup=()=>`<div class="wrap page"><h2>Customer support</h2><p class="sub">Answers to common questions, or send us a message and we'll reply within one working day.</p><div class="two"><div>
<details><summary>How long does delivery take?</summary><p>Most orders arrive in 3–5 working days. Delivery is free over ₹799 and ₹49 below that.</p></details>
<details><summary>What is your return policy?</summary><p>Unworn, unwashed socks can be returned within 30 days for a refund or exchange.</p></details>
<details><summary>How do I pick my size?</summary><p><button class="link" data-act="guide">Open the size guide</button> to match your UK or EU shoe size to S, M or L.</p></details>
<details><summary>How should I wash them?</summary><p>Machine wash cold, inside out, and tumble dry low to keep them soft and snug.</p></details>
<details><summary>Which payment methods do you accept?</summary><p>UPI, cards and cash on delivery.</p></details></div>
<form class="box f" data-form="contact" id="cf"><h3>Contact us</h3><div><label for="c1">Name</label><input class="in" id="c1" name="n" required></div><div><label for="c2">Email</label><input class="in" id="c2" name="e" type="email" required></div><div><label for="c3">How can we help?</label><textarea class="in" id="c3" rows="4" required></textarea></div><button class="btn dk">Send message</button></form></div></div>`;
const vNF=()=>`<div class="wrap page"><h2>Page not found</h2><p class="sub">That page doesn't exist.</p><a class="btn" href="#/">Back to home</a></div>`;

/* ---------- silk background (home hero) ---------- */
function initSilk(){const cv=$("#silk");if(!cv)return;const ctx=cv.getContext("2d"),box=cv.parentElement;let W,H,img,t=0;
 const nz=(x,y)=>{const G=2.71828;return(G*Math.sin(G*x)*G*Math.sin(G*y)*(1+x))%1};
 const fr=()=>{const d=img.data,o=.02*t;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=x/W*2,v=y/H*2,ty=v+.03*Math.sin(8*u-o);
  const p=.6+.4*Math.sin(5*(u+ty+Math.cos(3*u+5*ty)+.02*o)+Math.sin(20*(u+ty-.1*o)));const k=Math.max(0,p-nz(x*4,y*4)/15*.8),i=(y*W+x)*4;
  d[i]=60*k;d[i+1]=82*k;d[i+2]=235*k;d[i+3]=255}ctx.putImageData(img,0,0);t++};
 const lp=()=>{fr();raf=requestAnimationFrame(lp)};
 sz=()=>{W=Math.max(80,box.clientWidth>>2);H=Math.max(60,box.clientHeight>>2);cv.width=W;cv.height=H;img=ctx.createImageData(W,H)};
 sz();matchMedia("(prefers-reduced-motion:reduce)").matches?fr():lp()}
addEventListener("resize",()=>{if($("#silk"))sz()});

/* ---------- router ---------- */
function render(){cancelAnimationFrame(raf);closeM();const [,r,a]=(location.hash||"#/").slice(1).split("/");
 const m={"":vHome,shop:vShop,product:vProd,cart:vCart,checkout:vCheck,done:vDone,account:vAcc,support:vSup};
 if(r!=="checkout")buy=buy&&r==="checkout"?buy:null;
 app.innerHTML=(edit?EB:"")+(r?BK:"")+(m[r||""]||vNF)(a);scrollTo(0,0);document.title=r?`${r[0].toUpperCase()+r.slice(1)} – scokzs`:"scokzs – premium socks, fair prices";
 if(!r)initSilk();if(r==="shop")results();badge()}
addEventListener("hashchange",render);

/* ---------- owner editing ---------- */
const EB=`<div class="ebar"><div class="wrap">Edit mode is on. Use <strong>Edit</strong> on any product, or <button class="link" data-act="new" style="color:inherit">add a product</button>. Saved changes go live for everyone.</div></div>`;
const BK=`<div class="wrap"><a class="back" href="#/">← Back to home</a></div>`;
const NOIMG=`<span class="cat">Using the illustrated sock</span>`;
function editor(id){const x=id?pid(id):{n:"",c:"Crew",p:299,d:"",b:"#2437C8",s:"#FBFAF6",t:"stripe",f:DEF,r:4.5};draftImg=x.img||null;
 modal(`<h3>${id?"Edit product":"Add product"}</h3><form class="ed" data-form="prod" data-id="${id||0}"><div><label for="e1">Name</label><input class="in" id="e1" name="n" required value="${esc(x.n)}"></div><div class="f2"><div><label for="e2">Category</label><input class="in" id="e2" name="c" list="cats" required value="${esc(x.c)}"><datalist id="cats">${[...new Set(P.map(p=>p.c))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><div><label for="e3">Price (₹)</label><input class="in" id="e3" name="p" type="number" min="1" required value="${x.p}"></div></div><div><label for="e9">For</label><select class="in" id="e9" name="g">${["Unisex","Women","Men","Kids"].map(g=>`<option${(x.g||"Unisex")==g?" selected":""}>${g}</option>`).join("")}</select></div><div><label for="e4">Description</label><textarea class="in" id="e4" name="d" rows="3">${esc(x.d||"")}</textarea></div><div><label for="e5">Highlights (one per line)</label><textarea class="in" id="e5" name="f" rows="4">${esc((x.f&&x.f.length?x.f:DEF).join(String.fromCharCode(10)))}</textarea></div><div><label>Product image</label><div style="display:flex;gap:12px;align-items:center"><div id="ep">${x.img?`<img class="thumb" src="${x.img}" alt="">`:NOIMG}</div><div><input type="file" accept="image/*" data-up="1"><br><button type="button" class="link" data-act="noimg">Remove image</button></div></div></div><div class="c3"><div><label for="e6">Sock colour</label><input class="in" id="e6" name="b" type="color" value="${x.b}"></div><div><label for="e7">Pattern colour</label><input class="in" id="e7" name="s" type="color" value="${x.s}"></div><div><label for="e8">Pattern</label><select class="in" id="e8" name="t">${["stripe","dots","block"].map(t=>`<option${x.t==t?" selected":""}>${t}</option>`).join("")}</select></div></div><label class="pay"><input type="checkbox" name="hide"${x.hide?" checked":""}> Hide from the store</label><button class="btn dk" id="sv">Save and publish</button>${id?`<button type="button" class="btn o" data-act="del" data-id="${id}">Delete product</button>`:""}<p class="cat" id="st" style="margin:0"></p></form>`)}
async function pub(){const st=$("#st"),b=$("#sv");if(b)b.disabled=true;if(st)st.textContent="Publishing…";
 try{const a='<script type="application/json" id="pdata">',i=SRC.indexOf(a)+a.length,j=SRC.indexOf("</scr"+"ipt>",i);
  let h=SRC.slice(0,i)+JSON.stringify(P).replace(/</g,String.fromCharCode(92)+"u003c")+SRC.slice(j);
  h=h.replace(new RegExp("<script[^>]* src=[^>]*></scr"+"ipt>","g"),"");
  await art.publish(h)}
 catch(e){const c=e&&e.code;if(b)b.disabled=false;if(st)st.textContent=c=="conflict"?"The store was just updated elsewhere. Reloading…":(c=="not_writer"||c=="not_granted")?"This account can't edit the store.":"Couldn't publish ("+(c||"error")+"). Please try again."}}
document.addEventListener("change",e=>{if(!e.target.dataset.up)return;const f=e.target.files[0];if(!f)return;const rd=new FileReader;
 rd.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);draftImg=c.toDataURL("image/jpeg",.82);$("#ep").innerHTML=`<img class="thumb" src="${draftImg}" alt="">`};im.src=rd.result};rd.readAsDataURL(f)});

/* ---------- actions ---------- */
function add(id,size,q){const l=cart.find(c=>c.id==id&&c.size==size);l?l.q+=q:cart.push({id,size,q});saveC();const x=pid(id);
 modal(`<h3>Added to cart</h3><p>${x.n} · Size ${size} × ${q} is in your cart.</p><div class="acts"><button class="btn o" data-act="close">Continue Shopping</button><button class="btn" data-act="go" data-href="#/checkout">Proceed to Checkout</button></div>`)}
document.addEventListener("click",e=>{if(e.target.id==="ov")return closeM();const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=+b.dataset.id,k=+b.dataset.k,v=b.dataset.v;
 if(a=="close")closeM();
 else if(a=="go"){closeM();location.hash=b.dataset.href}
 else if(a=="quick")add(id,dsz(pid(id)),1);
 else if(a=="add")add(id,sel.size,sel.q);
 else if(a=="buy"){buy=[{id,size:sel.size,q:sel.q}];location.hash="#/checkout"}
 else if(a=="co")buy=null;
 else if(a=="size"){sel.size=v;document.querySelectorAll(".sz").forEach(s=>s.classList.toggle("on",s===b))}
 else if(a=="q+"||a=="q-"){sel.q=Math.max(1,Math.min(10,sel.q+(a=="q+"?1:-1)));$("#qv").textContent=sel.q}
 else if(a=="guide")modal(guide());
 else if(a=="cat"){F.cat=v;render()}
 else if(a=="inc"||a=="dec"){cart[k].q=Math.max(1,cart[k].q+(a=="inc"?1:-1));saveC();render()}
 else if(a=="rm"){cart.splice(k,1);saveC();render()}
 else if(a=="tab"){tab=v;render()}
 else if(a=="out"){user=null;sv("sk_user",null);render()}
 else if(a=="toggle"){edit=!edit;b.textContent=edit?"Exit edit mode":"Edit store";render()}
 else if(a=="ed")editor(id);
 else if(a=="gen")location.hash=v=="All"?"#/shop":"#/shop/"+v;
 else if(a=="new")editor(0);
 else if(a=="noimg"){draftImg=null;$("#ep").innerHTML=NOIMG}
 else if(a=="del"){if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Click again to confirm delete";return}P=P.filter(p=>p.id!=id);cart=cart.filter(l=>l.id!=id);saveC();pub()}});
document.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;F[f]=e.target.value;if(f=="max")$("#mxv").textContent=R(+F.max);results()});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
document.addEventListener("submit",e=>{e.preventDefault();const fm=e.target,f=fm.dataset.form;if(!f)return;const d=Object.fromEntries(new FormData(fm));
 if(f=="rev"){const id=fm.dataset.id;(rev[id]=rev[id]||[]).unshift([d.n,+d.r,d.t]);sv("sk_rev",rev);render()}
 else if(f=="order"){const ls=lines(),T=tot(ls);last={id:"SK"+String(Date.now()).slice(-6),name:d.name,email:d.email,city:d.city,pay:d.pay,total:T.t,date:new Date().toLocaleDateString("en-IN"),items:ls.map(l=>({n:l.x.n,size:l.size,q:l.q,p:l.x.p}))};
  orders.unshift(last);sv("sk_orders",orders);if(!buy){cart=[];saveC()}buy=null;location.hash="#/done"}
 else if(f=="login"){user={name:d.name,email:d.email};sv("sk_user",user);render()}
 else if(f=="prod"){const id=+fm.dataset.id,o={n:d.n,c:d.c,p:+d.p,d:d.d,f:d.f.split(String.fromCharCode(10)).map(s=>s.trim()).filter(Boolean),b:d.b,s:d.s,t:d.t,hide:!!d.hide,g:d.g,img:draftImg||""};
  if(id)Object.assign(pid(id),o);else P.push({id:Math.max(0,...P.map(p=>p.id))+1,r:4.5,...o});pub()}
 else if(f=="prof"){user={...user,...d};sv("sk_user",user);render();modal("<h3>Saved</h3><p>Your profile has been updated.</p>")}
 else if(f=="contact"){fm.innerHTML=`<div class="ok"><strong>Message sent.</strong><br>Thanks for reaching out. We'll reply within one working day.</div>`}});
(async()=>{try{const u=await claude.use("user"),a=await claude.use("artifact");if(u&&a&&u.canEdit()){art=a;$("#eb").hidden=false}}catch(e){}})();
badge();render();
</script>
